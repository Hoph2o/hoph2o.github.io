<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hoph2o</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .nav a {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: #444;
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 1.2em;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .nav a:hover {
      background: #00bcd4;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 0 20px #00bcd4;
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav">
      <a href="/blimp">🎧 BLIMP AUDIO</a>
      <a href="/milk">🥛 MILK LEADERBOARD</a>
      <a href="/search">🔍 DRIVE SEARCH</a>
    </div>
  </div>

  <footer>
    @hoph2o
  </footer>

</body>
</html>
