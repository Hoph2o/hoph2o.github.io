<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Booster + EQ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Audio Booster with EQ</h2>

  <label>🎵 Choose a sample:
    <select id="presetSelect">
      <option value="">-- Select a sample --</option>
    </select>
  </label>

  <label>📂 Or upload your own:
    <input type="file" id="audioFile" accept="audio/*">
  </label>

  <div class="buttons">
    <button onclick="playAudio()">▶️ Play</button>
    <button onclick="pauseAudio()">⏸️ Pause</button>
    <button onclick="stopAudio()">⏹️ Stop</button>
    <button onclick="activateJameosMode()">🔥 Jameos Mode</button>
  </div>

  <input type="range" id="seekBar" min="0" max="1" step="0.01" value="0">
  <div id="timeDisplay">0:00 / 0:00</div>

  <label><span class="slider-label">🎛️ Bass:</span>
    <input type="range" id="bass" min="-30" max="30" value="0" title="0 dB">
  </label>
  <label><span class="slider-label">🎛️ Mid:</span>
    <input type="range" id="mid" min="-30" max="30" value="0" title="0 dB">
  </label>
  <label><span class="slider-label">🎛️ Treble:</span>
    <input type="range" id="treble" min="-30" max="30" value="0" title="0 dB">
  </label>
  <label><span class="slider-label">🔊 Gain:</span>
    <input type="range" id="gain" min="1" max="5" step="0.1" value="1" title="1x gain">
  </label>

  <script src="script.js"></script>
</body>
</html>
